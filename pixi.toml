[workspace]
name = "renconte"
version = "0.1.0"
description = "Mobile-first French children's book reader PWA powered by Gemini Vision and TTS"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
nodejs = ">=22,<25"

[pypi-dependencies]
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.34.0", extras = ["standard"] }
google-genai = ">=1.0.0"
python-multipart = ">=0.0.20"
python-dotenv = ">=1.0.0"
pytest = ">=8.0.0"
httpx = ">=0.28.0"

[tasks]
install-frontend = "npm --prefix frontend install"
dev-backend = "uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000"
dev-frontend = "npm --prefix frontend run dev"
build-frontend = "npm --prefix frontend run build"
test = "pytest backend/tests"
start = "uvicorn backend.main:app --host 0.0.0.0 --port 8080"
